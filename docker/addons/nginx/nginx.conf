worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout 65;

    # ---------- upstream: Zope/ZMS backends ----------

    upstream zms_readonly {
        # server 0.0.0.0:8085;
        server 0.0.0.0:8086;
    }

    upstream zms_readwrite {
        server 0.0.0.0:8086;
    }

    # ==================================================
    # HTTP -> HTTPS redirect
    # ==================================================

    server {
        listen 80;
        server_name localhost test.zms.hosting;

        # Requests where the last path segment starts with "manage" -> read-write backend
        # http://docs.zope.org/zope2/zope2book/VirtualHosting.html #
        # # location ~/manage(_[A-Za-z0-9_]+)?(?:\?.*)?(?:#.*)?$ {
        # #     rewrite ^/(.*)$ /VirtualHostBase/$scheme/$host:$server_port/sites/site_photoscience/content/VirtualHostRoot/$1 break;
        # #     proxy_pass         http://zms_readwrite;
        # #     proxy_set_header   Host              $host;
        # #     proxy_set_header   X-Real-IP         $remote_addr;
        # #     proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # #     proxy_set_header   X-Forwarded-Proto $scheme;
        # #     proxy_redirect     off;
        # # }

        return 301 https://$host$request_uri;
    }

    # ==================================================
    # HTTPS frontend
    # ==================================================

    server {
        listen 443 ssl;
        http2 on;
        server_name localhost test.zms.hosting;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;

        # Requests containing manage* -> RW backend
        location ~ /manage(_[A-Za-z0-9_]+)?$ {

            rewrite ^/(.*)$ /VirtualHostBase/https/$host/VirtualHostRoot/$1 break;
            proxy_pass http://zms_readwrite;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  443;

            proxy_redirect off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Everything else -> RO backend
        location / {

            # # rewrite ^/(.*)$ /VirtualHostBase/$scheme/$host:$server_port/sites/site_photoscience/content/VirtualHostRoot/$1 break;
            # # proxy_pass         http://zms_readonly;
            # # proxy_set_header   Host              $host;
            # # proxy_set_header   X-Real-IP         $remote_addr;
            # # proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            # # proxy_set_header   X-Forwarded-Proto $scheme;
            # # proxy_redirect     off;
            
            rewrite ^/(.*)$ /VirtualHostBase/https/$host/VirtualHostRoot/$1 break;
            proxy_pass http://zms_readonly;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  443;

            proxy_redirect off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
