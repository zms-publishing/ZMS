x-instance-common: &instance_common
  image: zms6:ubuntu26.04
  build:
    context: .
    dockerfile: ./dockerfile
    args:
      - INSTANCE_DIR=${INSTANCE_DIR}
      - VENV_DIR=${VENV_DIR}
      - IS_DEBUG=false
      - UID=${UID}
      - GID=${GID}
  depends_on:
    - zeo
  user: zope
  volumes:
    - .:${INSTANCE_DIR}:rw
    ### Make sure the container does not mount the subfolder ${VENV_DIR} as a volume
    ### (mask it with an anonymous volume so the image's venv is preserved)
    - ${VENV_DIR}
    ### For utilizing a local path as SRC_MOUNT
    - ${SRC_MOUNT}/:${SRC_DIR}/:rw
  command: >
    bash -c "
      ${SRC_DIR}/docker/variants/ubuntu/etc/start_zope.sh &&
      sleep infinity
    "
  networks:
    - zms_network

# IMPORTANT: Create the Network first to make it external
# > docker network create zms_network
networks:
  zms_network:
    driver: bridge

services:
  ### Zope: Zope Application Server
  instance1:
    <<: *instance_common
    environment:
      - PYTHONUNBUFFERED="1"
      - SOFTWARE_HOME="${VENV_DIR}/bin"
      - PYTHON="${VENV_DIR}/bin/python"
      - HTTP_PORT=8085
      - READ_ONLY=true
    ports:
      - "8085:8080"

  instance2:
    <<: *instance_common
    environment:
      - PYTHONUNBUFFERED="1"
      - SOFTWARE_HOME="${VENV_DIR}/bin"
      - PYTHON="${VENV_DIR}/bin/python"
      - HTTP_PORT=8086
      - READ_ONLY=false
    ports:
      - "8086:8080"

  instance3:
    ### Code-Server for Remote Development
    ### Note: This instance initially is not running Zope, 
    ### but code-server for remote development.
    <<: *instance_common
    environment:
      - PYTHONUNBUFFERED="1"
      - SOFTWARE_HOME="${VENV_DIR}/bin"
      - PYTHON="${VENV_DIR}/bin/python"
      - HTTP_PORT=8889
      - READ_ONLY=false
    ports:
      - "8889:8080"
      - "8888:8888"
    command: >
      bash -c "
        code-server --bind-addr 0.0.0.0:8888 --auth none  $INSTANCE_DIR
      "

  ### ZEO: Zope Enterprise Objects
  zeo:
    <<: *instance_common
    depends_on: []
    command: >
      bash -c "
      ${SRC_DIR}/docker/variants/ubuntu/etc/start_zeo.sh &
      sleep infinity
      "
